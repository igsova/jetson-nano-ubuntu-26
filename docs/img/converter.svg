<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 254" width="960" height="254" role="img" aria-label="How the converter works, in six steps">
<style>
  .bg{fill:#ffffff}
  .t{font-family:-apple-system,"Segoe UI",Helvetica,Arial,"DejaVu Sans",sans-serif;fill:#1d1f21}
  .m{fill:#5d6166}
  .h{font-weight:600}
  .ub{fill:#fbe3d9;stroke:#E95420}
  .nv{fill:#e6f2d3;stroke:#5c8f00}
  .pr{fill:#dfeaf6;stroke:#2f6fb3}
  .kp{fill:#eeece6;stroke:#9a958a}
  .hw{fill:#f4f2ec;stroke:#b8b3a8}
  .ln{stroke:#d9d5cc}
  .ar{stroke:#5d6166;fill:none}
  .arh{fill:#5d6166}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}
    .t{fill:#e6edf3}
    .m{fill:#9aa4ae}
    .ub{fill:#3d2219;stroke:#f07a4a}
    .nv{fill:#22301a;stroke:#8fd11a}
    .pr{fill:#182a3e;stroke:#5c9ce0}
    .kp{fill:#24262a;stroke:#6e7681}
    .hw{fill:#1b1e23;stroke:#555c66}
    .ln{stroke:#30363d}
    .ar{stroke:#9aa4ae}
    .arh{fill:#9aa4ae}
  }
</style>
<rect class="bg" width="960" height="254" rx="12"/>
<text x="20" y="34" class="t h" font-size="17" text-anchor="start" >From JetPack 4.6.6 to Ubuntu 26.04 with one card</text>
<rect class="kp" x="20.0" y="60" width="140" height="104" rx="10" stroke-width="1.5"/>
<text x="32.0" y="84" class="t m h" font-size="13" text-anchor="start" >1</text>
<text x="90.0" y="106" class="t h" font-size="14" text-anchor="middle" >JetPack 4.6.6 card</text>
<text x="90.0" y="130" class="t m" font-size="11.5" text-anchor="middle" >NVIDIA's image, set up</text>
<text x="90.0" y="146" class="t m" font-size="11.5" text-anchor="middle" >and updated</text>
<line class="ar" x1="165.0" y1="112.0" x2="164.0" y2="112.0" stroke-width="1.5"/>
<path class="arh" d="M171.0 112.0 l-8 -4.5 v9 z"/>
<rect class="pr" x="176.0" y="60" width="140" height="104" rx="10" stroke-width="1.5"/>
<text x="188.0" y="84" class="t m h" font-size="13" text-anchor="start" >2</text>
<text x="246.0" y="106" class="t h" font-size="14" text-anchor="middle" >nano26-convert</text>
<text x="246.0" y="130" class="t m" font-size="11.5" text-anchor="middle" >on the Nano: downloads</text>
<text x="246.0" y="146" class="t m" font-size="11.5" text-anchor="middle" >Ubuntu, NVIDIA, kernel</text>
<text x="246.0" y="186" class="t m" font-size="12.5" text-anchor="middle" >about 23 min</text>
<line class="ar" x1="321.0" y1="112.0" x2="320.0" y2="112.0" stroke-width="1.5"/>
<path class="arh" d="M327.0 112.0 l-8 -4.5 v9 z"/>
<rect class="pr" x="332.0" y="60" width="140" height="104" rx="10" stroke-width="1.5"/>
<text x="344.0" y="84" class="t m h" font-size="13" text-anchor="start" >3</text>
<text x="402.0" y="106" class="t h" font-size="14" text-anchor="middle" >nano26.img</text>
<text x="402.0" y="130" class="t m" font-size="11.5" text-anchor="middle" >about 6.7 GiB, with</text>
<text x="402.0" y="146" class="t m" font-size="11.5" text-anchor="middle" >your account and Wi-Fi</text>
<line class="ar" x1="477.0" y1="112.0" x2="476.0" y2="112.0" stroke-width="1.5"/>
<path class="arh" d="M483.0 112.0 l-8 -4.5 v9 z"/>
<rect class="kp" x="488.0" y="60" width="140" height="104" rx="10" stroke-width="1.5"/>
<text x="500.0" y="84" class="t m h" font-size="13" text-anchor="start" >4</text>
<text x="558.0" y="106" class="t h" font-size="14" text-anchor="middle" >Write the card</text>
<text x="558.0" y="130" class="t m" font-size="11.5" text-anchor="middle" >balenaEtcher on a PC,</text>
<text x="558.0" y="146" class="t m" font-size="11.5" text-anchor="middle" >over the same card</text>
<line class="ar" x1="633.0" y1="112.0" x2="632.0" y2="112.0" stroke-width="1.5"/>
<path class="arh" d="M639.0 112.0 l-8 -4.5 v9 z"/>
<rect class="ub" x="644.0" y="60" width="140" height="104" rx="10" stroke-width="1.5"/>
<text x="656.0" y="84" class="t m h" font-size="13" text-anchor="start" >5</text>
<text x="714.0" y="106" class="t h" font-size="14" text-anchor="middle" >First boot</text>
<text x="714.0" y="130" class="t m" font-size="11.5" text-anchor="middle" >grows the card, installs</text>
<text x="714.0" y="146" class="t m" font-size="11.5" text-anchor="middle" >Ubuntu 26.04</text>
<text x="714.0" y="186" class="t m" font-size="12.5" text-anchor="middle" >about 10 min</text>
<line class="ar" x1="789.0" y1="112.0" x2="788.0" y2="112.0" stroke-width="1.5"/>
<path class="arh" d="M795.0 112.0 l-8 -4.5 v9 z"/>
<rect class="nv" x="800.0" y="60" width="140" height="104" rx="10" stroke-width="1.5"/>
<text x="812.0" y="84" class="t m h" font-size="13" text-anchor="start" >6</text>
<text x="870.0" y="106" class="t h" font-size="14" text-anchor="middle" >Second boot</text>
<text x="870.0" y="130" class="t m" font-size="11.5" text-anchor="middle" >builds and checks</text>
<text x="870.0" y="146" class="t m" font-size="11.5" text-anchor="middle" >the GPU stack</text>
<text x="870.0" y="186" class="t m" font-size="12.5" text-anchor="middle" >about 70 min</text>
<text x="20" y="232" class="t m" font-size="12.5" text-anchor="start" >Then it restarts into the login screen; /var/log/nano26/report.txt lists every check. Nothing from NVIDIA is redistributed: each Nano downloads it.</text>
</svg>